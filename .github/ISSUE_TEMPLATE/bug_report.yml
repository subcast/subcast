name: Bug report
description: Something in Subcast doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please don't include license keys or other private details; issues are public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Subcast version
      description: "Long-press the Subcast icon, tap App info, and scroll to the bottom."
      placeholder: "0.17.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 9, Android 16"
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display
      description: Glasses, monitor or TV, and how it's connected.
      placeholder: "VITURE Beast over USB-C"
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
